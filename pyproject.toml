[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lzn"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "ase",
    "sevenn",
    "cclib",
    "colorama",
    ]

[tool.setuptools.packages.find]
where = ["."]
include = ["lzn*"]

